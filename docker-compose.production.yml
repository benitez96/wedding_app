services:
  # Migraciones automáticas al startup
  migrations:
    build:
      context: .
      target: deps # Solo necesita dependencias, no el build de Next.js
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/wedding_app
      - TZ=America/Argentina/Buenos_Aires
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network
    command: sh -c "npx prisma migrate deploy && echo 'Migrations completed'"
    restart: "no" # Corre una vez y termina

  # App principal
  wedding-app:
    build: .
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/wedding_app
      - JWT_SECRET=${JWT_SECRET}
      - TZ=America/Argentina/Buenos_Aires
    depends_on:
      migrations:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    volumes:
      - /volumes/wedding-app/logs:/app/logs
    restart: unless-stopped
    networks:
      - app_network
      - monitoring_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Service auxiliar para comandos ad-hoc (no arranca automáticamente)
  tools:
    build:
      context: .
      target: codebase # Stage optimizado: node_modules + scripts + prisma (sin build de Next.js)
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/wedding_app
      - JWT_SECRET=${JWT_SECRET}
      - TZ=America/Argentina/Buenos_Aires
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network
    command: sleep infinity # Mantiene el container vivo para comandos interactivos

  # Base de datos
  db:
    image: postgres:17.6-alpine
    environment:
      - POSTGRES_DB=wedding_app
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - TZ=America/Argentina/Buenos_Aires
    volumes:
      - /volumes/wedding-app/postgres:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wedding_app"]
      interval: 10s
      timeout: 5s
      retries: 5
      #
  # Reverse Proxy - Caddy (único servicio con acceso a internet)
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - .env
    environment:
      - DOMAIN=${DOMAIN}
      - BASIC_AUTH_HASH=${BASIC_AUTH_HASH}
      - TZ=America/Argentina/Buenos_Aires
    volumes:
      - ./config/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - /volumes/wedding-app/caddy/data:/data
      - /volumes/wedding-app/caddy/config:/config
      - /volumes/wedding-app/caddy/logs:/var/log/caddy
    depends_on:
      - wedding-app
    restart: unless-stopped
    networks:
      - public_network
      - app_network
      - monitoring_network
    command:
      [
        "caddy",
        "run",
        "--config",
        "/etc/caddy/Caddyfile",
        "--adapter",
        "caddyfile",
      ]

networks:
  public_network:
    driver: bridge
    internal: false # Solo Caddy puede salir a internet
  monitoring_network:
    driver: bridge
    internal: true # Red interna, sin acceso a internet
  app_network:
    driver: bridge
    internal: true # Red interna para app y DB
